<svg width="680" height="570" viewBox="0 0 680 570" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="680" height="570" fill="#ffffff"/>

<!-- Client -->
<rect x="270" y="20" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="47" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Client app</text>

<line x1="340" y1="64" x2="340" y2="158" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Outer container -->
<rect x="40" y="90" width="600" height="440" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="64" y="122" font-size="14" font-weight="600" fill="#2C2C2A">Docker compose stack</text>
<text x="64" y="140" font-size="12" fill="#5F5E5A">docker-compose.yml</text>

<!-- Nginx -->
<rect x="250" y="160" width="180" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">Nginx</text>
<text x="340" y="202" text-anchor="middle" font-size="12" fill="#085041">Reverse proxy</text>

<line x1="340" y1="216" x2="340" y2="244" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- API -->
<rect x="250" y="246" width="180" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">API</text>
<text x="340" y="288" text-anchor="middle" font-size="12" fill="#3C3489">Express &amp; Socket.IO</text>

<path d="M340 302 L340 332 L195 332 L195 360" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 302 L340 332 L485 332 L485 360" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Postgres -->
<rect x="110" y="362" width="170" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="195" y="384" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C">Postgres</text>
<text x="195" y="404" text-anchor="middle" font-size="12" fill="#712B13">Persistent data</text>

<!-- Redis -->
<rect x="400" y="362" width="170" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="485" y="384" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C">Redis</text>
<text x="485" y="404" text-anchor="middle" font-size="12" fill="#712B13">Pub/sub &amp; cache</text>

<line x1="195" y1="440" x2="195" y2="420" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- pgAdmin -->
<rect x="110" y="440" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="195" y="467" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">pgAdmin</text>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>
